name = "zcode"
version = "0.1.1"
description = "ZCode, the coding assistant of Z.ai, set up to work through Kito"
api = 1
# It asks the daemon nothing: the hooks are Kito's own commands, run by
# ZCode as the person who runs it.
permissions = ["read"]

[assistant]
name = "zcode"

[cleanup]
about = "Takes out what it wrote in the project, and its hooks in your own configuration of ZCode"

[[command]]
name = "zcode"
about = "ZCode's hooks, which are a person's own: hooks [install | remove]"
